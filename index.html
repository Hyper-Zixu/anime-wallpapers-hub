<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wallpapers Hub - 4K & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

    <nav class="main-nav">
        <div class="logo">LW HUB</div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Anime</a></li>
            <li><a href="#">Cars</a></li>
            <li><a href="#">Live</a></li>
        </ul>
        <button class="search-btn">Search 4K</button>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Experience 4K. Living. Wallpapers.</h1>
            <p>Download the sharpest Anime, Cars, and Live themes.</p>
            <div class="hero-btns">
                <button class="cta-primary">Explore All</button>
                <button class="cta-secondary">Featured Anime</button>
            </div>
        </div>
    </header>

    <section class="categories">
        <h2>Wallpapers Categories</h2>
        <div class="category-grid">
            <div class="category-card anime">
                <span>Anime (2.1M)</span>
            </div>
            <div class="category-card cars">
                <span>Cars (1.5M)</span>
            </div>
            <div class="category-card nature">
                <span>Nature</span>
            </div>
            <div class="category-card abstract">
                <span>Abstract</span>
            </div>
        </div>
    </section>

    <main class="wallpaper-main">
        <h2>Latest Wallpapers</h2>
        <div class="wallpaper-grid" id="mainGrid">
            </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Live Wallpapers Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
