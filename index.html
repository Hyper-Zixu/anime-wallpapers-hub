<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku Galaxy - 4K Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg"></div>
    
    <nav class="glass-nav">
        <div class="logo">OTAKU<span>GALAXY</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Find your vibe..." onkeyup="searchWallpapers()">
        </div>
    </nav>

    <header class="featured-hero">
        <div class="hero-overlay">
            <span class="tag">FEATURED 4K</span>
            <h1>NEO TOKYO 2077</h1>
            <p>High-resolution aesthetic for your mobile and desktop.</p>
            <button class="btn-neon">GET NOW</button>
        </div>
    </header>

    <section class="container">
        <div class="filter-tabs">
            <button class="tab active" onclick="filterCategory('All', this)">ALL</button>
            <button class="tab" onclick="filterCategory('Anime', this)">ANIME</button>
            <button class="tab" onclick="filterCategory('Cars', this)">CARS</button>
            <button class="tab" onclick="filterCategory('Live', this)">LIVE</button>
        </div>

        <div class="wall-grid" id="wallpaperGrid">
            </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
