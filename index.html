<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku Walls - 4K Anime Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-kanji">壁紙</div>

    <nav class="navbar">
        <div class="logo">OTAKU<span>WALLS</span> <span class="jp-text">オタク</span></div>
        <div class="nav-items">
            <a href="#">Anime</a>
            <a href="#">Cars</a>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>ULTIMATE <span>4K</span> AESTHETIC</h1>
            <p>Level up your screen. 限界を超えろ.</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search anime, supercar, vibes...">
                <button onclick="searchWallpapers()">SEARCH</button>
            </div>
        </div>
    </header>

    <main>
        <div class="category-filters">
            <button class="filter-btn active" onclick="filterCategory('All', this)">ALL</button>
            <button class="filter-btn" onclick="filterCategory('Anime', this)">ANIME アニメ</button>
            <button class="filter-btn" onclick="filterCategory('Cars', this)">CARS 車</button>
        </div>

        <div class="grid" id="wallpaperGrid">
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
