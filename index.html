<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku Walls - 4K & Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-kanji">壁紙</div>

    <nav class="navbar">
        <div class="logo">OTAKU<span>WALLS</span> <span class="jp-text">アニメ</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search 4K / Live..." onkeyup="searchWallpapers()">
        </div>
    </nav>

    <header class="hero">
        <h1>BEYOND <span>LIMITS</span></h1>
        <p>Premium 4K Anime & Live Car Wallpapers.</p>
    </header>

    <main class="main-container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterData('All', this)">ALL</button>
            <button class="filter-btn" onclick="filterData('Anime', this)">ANIME</button>
            <button class="filter-btn" onclick="filterData('Cars', this)">CARS</button>
            <button class="filter-btn" onclick="filterData('Live', this)">LIVE 🔴</button>
        </div>

        <div class="wallpaper-grid" id="grid">
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
